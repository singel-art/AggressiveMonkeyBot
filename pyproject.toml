[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aggressive-monkey-bot-market-intelligence"
version = "0.1.0"
description = "Collecte, stockage point-in-time et contexte macro pour AggressiveMonkeyBot"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

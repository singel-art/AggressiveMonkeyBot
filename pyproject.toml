[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aggressive-monkey-bot-market-intelligence"
version = "0.1.0"
description = "Collecte, stockage point-in-time et contexte macro pour AggressiveMonkeyBot"
requires-python = ">=3.11"
# Bornes compatibles. Les versions exactes testees sont figees dans requirements.txt.
dependencies = [
    "requests>=2.34,<3",
    "tzdata>=2026.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
# Lecture des classeurs World Gold Council deposes a la main.
wgc = ["openpyxl>=3.1,<4"]
dev = ["pytest>=9.2,<10", "openpyxl>=3.1,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
